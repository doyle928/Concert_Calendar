name: Daily concert scrape

on:
  schedule:
    - cron: "0 12 * * *"   # once a day at 12:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to commit the data/ folder back

concurrency:
  group: daily-concert-scrape
  cancel-in-progress: false
  
jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape and parse
        run: python scrape.py
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TARGET_URL: https://edmtrain.com/michigan

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update scraped data"

            # Retry if another push updates main before ours succeeds.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main

              if git push origin HEAD:main; then
                echo "Successfully pushed scraped data."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi

              echo "Push rejected; retrying with latest main..."
              sleep 3
            done
          else
            echo "No data changes to commit."
          fi
      - name: Sync to Google Calendar
        run: python calendar_sync.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
